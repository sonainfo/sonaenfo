<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonainfo | Chairman Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600&display=swap">
<style>
:root{--bg:#f1f3f6;--sf:#fff;--tx:#14202f;--mu:#667085;--bd:#e1e5ec;--pr:#0f766e;--br:#b4832a;--ok:#12803f;--wa:#b45309;--er:#c42b2b;--sb:#0d1826;--hv:#f5f7fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#09111c;--sf:#111c2b;--tx:#e6ebf2;--mu:#93a1b5;--bd:#223148;--hv:#16243a;--sb:#060c15}}
:root[data-theme=dark]{--bg:#09111c;--sf:#111c2b;--tx:#e6ebf2;--mu:#93a1b5;--bd:#223148;--hv:#16243a;--sb:#060c15}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--sb)}
.lg{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border-radius:14px;overflow:hidden}
.lg-a{background:#0f2a2c;color:#e9f3f1;padding:44px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.lg-a h1{font-size:40px;line-height:1.1}.lg-a p{color:#a9c7c2;max-width:300px}
.lg-b{padding:44px}.lg-b h2{font-size:26px}.lg-b>p{color:var(--mu);margin:4px 0 18px}
.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
.fg textarea{min-height:90px;resize:vertical}
.err{color:var(--er);font-size:12px;min-height:18px;margin-bottom:6px}
.btn{border:1px solid var(--bd);background:var(--sf);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--hv)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.p:hover{filter:brightness(1.1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.no{color:var(--er);border-color:var(--er)}
.btn.w{width:100%;padding:11px}
.hint{margin-top:14px;font-size:12px;color:var(--mu)}
#app{display:flex;min-height:100%}
aside{width:240px;background:var(--sb);color:#b9c4d4;position:fixed;top:0;bottom:0;left:0;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 12px;display:flex;flex-direction:column;z-index:50;transition:transform .2s}
.logo{font:600 21px Newsreader,serif;color:#fff;padding:0 10px 18px}.logo b{color:var(--br)}
nav{flex:1;overflow:auto}
nav button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;color:inherit;border-radius:8px;text-align:left;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(180,131,42,.18);color:#fff;box-shadow:inset 3px 0 var(--br)}
nav i{font-style:normal;width:20px;text-align:center}
.cnt{margin-left:auto;background:var(--br);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.me{border-top:1px solid rgba(255,255,255,.1);padding:12px 8px 0;font-size:12px}.me b{color:#fff;display:block}
main{margin-left:240px;flex:1;min-width:0}
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header .sp{flex:1}
#menu{display:none}
.srch{max-width:320px;width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
#c{padding:26px 24px;max-width:1300px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:28px}.ph p{color:var(--mu)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.cd>h3{font-size:17px;padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.cb{padding:16px 18px}
.kp{padding:16px 18px}.kp small{color:var(--mu)}.kp div{font:600 28px Newsreader,serif;margin-top:2px}
.kp.hl{border-color:var(--br)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mu);display:block}
.tg{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--hv);color:var(--mu)}
.tg.g{background:rgba(18,128,63,.14);color:var(--ok)}.tg.y{background:rgba(180,83,9,.14);color:var(--wa)}.tg.r{background:rgba(196,43,43,.14);color:var(--er)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:10px 18px;background:var(--hv)}
td{padding:11px 18px;border-top:1px solid var(--bd)}
.ac{display:flex;gap:6px}.ac .btn{padding:4px 10px;font-size:12px}
.ch{display:flex;gap:14px;align-items:flex-end;height:200px;padding-top:10px}
.ch>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.pair span{width:40%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px}
.in{background:var(--pr)}.ex{background:var(--br)}
.lgd{font-size:12px;color:var(--mu);display:flex;gap:14px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.pb{height:6px;background:var(--hv);border-radius:9px;margin-top:10px;overflow:hidden}.pb span{display:block;height:100%;background:var(--pr)}
.dc{padding:18px}.dc h3{font-size:18px}.dc p{color:var(--mu);margin:4px 0 8px;font-size:13px}
#mo{position:fixed;inset:0;background:rgba(5,10,20,.6);display:none;place-items:center;padding:16px;z-index:100}
#mo.on{display:grid}
.md{background:var(--sf);border-radius:12px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.md header{position:static;padding:14px 20px;border-radius:12px 12px 0 0}.md header h3{font-size:18px;flex:1}
#mb{padding:18px 20px}#mf{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
#ts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:200}
.t{background:var(--sb);color:#fff;padding:11px 16px;border-radius:8px;border-left:4px solid var(--br);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{color:var(--mu);padding:26px;text-align:center}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0}#menu{display:block}.lg{grid-template-columns:1fr}.lg-a{display:none}.lg-b{padding:30px 22px}.g3{grid-template-columns:1fr}#c{padding:18px 14px}header{padding-left:14px;padding-right:14px}.srch{display:none}header .sp{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login">
 <div class="lg">
  <div class="lg-a"><div class="logo" style="padding:0">Sona<b>info</b></div><div><h1>Chairman's office, in one place.</h1><p style="margin-top:12px">Approvals, finance, members, committees and meetings, all under your review.</p></div><small>Authorised access only</small></div>
  <div class="lg-b">
   <h2>Sign in</h2><p>Chairman Portal</p>
   <div class="fg"><label for="em">Email</label><input id="em" type="email" placeholder="chairman@sonainfo.com" autocomplete="username"></div>
   <div class="fg"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
   <div class="err" id="le"></div>
   <button class="btn p w" onclick="login()">Sign in</button>
   <p class="hint">Demo login: chairman@sonainfo.com / admin<br>Data is saved only in this browser.</p>
  </div>
 </div>
</div>

<div id="app" class="hide">
 <aside id="sb"><div class="logo">Sona<b>info</b></div><nav id="nav"></nav>
  <div class="me"><b>Chairman</b>chairman@sonainfo.com<br><button class="btn" style="margin-top:8px;padding:4px 10px" onclick="logout()">Sign out</button></div></aside>
 <main>
  <header><button class="btn" id="menu" onclick="sb.classList.toggle('open')" aria-label="Menu">☰</button>
   <input class="srch" id="q" placeholder="Search members, announcements..." oninput="gs(this.value)">
   <span class="sp"></span><button class="btn" onclick="theme()" aria-label="Toggle theme">◐ Theme</button></header>
  <div id="c"></div>
 </main>
</div>

<div id="mo"><div class="md"><header><h3 id="mt"></h3><button class="btn" onclick="cm()" aria-label="Close">✕</button></header><div id="mb"></div><div id="mf"></div></div></div>
<div id="ts"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');
const KEY='sonainfo_chairman_v2';
const SEED=()=>({
 members:[
  {id:1,name:'Rahul Kumar',role:'Chairman',dept:'Executive',email:'rahul@sonainfo.com',st:'Active'},
  {id:2,name:'Shivani Sharma',role:'Executive Assistant',dept:'Executive',email:'shivani@sonainfo.com',st:'Active'},
  {id:3,name:'Manas Verma',role:'Team Manager',dept:'Operations',email:'manas@sonainfo.com',st:'Active'},
  {id:4,name:'Ankit Singh',role:'Disciplinary Manager',dept:'Disciplinary',email:'ankit@sonainfo.com',st:'Pending'},
  {id:5,name:'Priyanka Rao',role:'Salary Team Lead',dept:'Finance',email:'priyanka@sonainfo.com',st:'Active'},
  {id:6,name:'Pankaj Kumar',role:'Operations Manager',dept:'Operations',email:'pankaj@sonainfo.com',st:'Active'}],
 ann:[
  {id:1,title:'Portal updated',text:'New approvals and audit features are live.',cat:'System',date:'2026-10-02'},
  {id:2,title:'Department review meeting',text:'Monthly review is scheduled for 5 October.',cat:'Meeting',date:'2026-10-01'},
  {id:3,title:'New administrative guidelines',text:'Updated guidelines have been published.',cat:'Policy',date:'2026-09-28'}],
 appr:[
  {id:1,title:'Software licence renewal',by:'Pankaj Kumar',type:'Expense',amt:24000,st:'Pending'},
  {id:2,title:'Hire two operations executives',by:'Manas Verma',type:'Hiring',amt:0,st:'Pending'},
  {id:3,title:'Salary advance policy change',by:'Priyanka Rao',type:'Policy',amt:0,st:'Pending'},
  {id:4,title:'Disciplinary case #12 closure',by:'Ankit Singh',type:'Disciplinary',amt:0,st:'Pending'}],
 tx:[
  {id:1,d:'2026-05-12',n:'Member contribution',t:'Income',a:210000},{id:2,d:'2026-05-20',n:'Operations',t:'Expense',a:96000},
  {id:3,d:'2026-06-10',n:'Member contribution',t:'Income',a:225000},{id:4,d:'2026-06-22',n:'Salaries',t:'Expense',a:140000},
  {id:5,d:'2026-07-09',n:'Operational recovery',t:'Income',a:180000},{id:6,d:'2026-07-25',n:'Software & services',t:'Expense',a:62000},
  {id:7,d:'2026-08-11',n:'Member contribution',t:'Income',a:240000},{id:8,d:'2026-08-27',n:'Salaries',t:'Expense',a:150000},
  {id:9,d:'2026-09-14',n:'Member contribution',t:'Income',a:252000},{id:10,d:'2026-09-30',n:'Department allocation',t:'Expense',a:118500},
  {id:11,d:'2026-10-02',n:'Company operations',t:'Expense',a:35000}],
 meet:[
  {id:1,title:'Department review',d:'2026-10-05',tm:'10:00',who:'All heads'},
  {id:2,title:'Finance review',d:'2026-10-12',tm:'14:00',who:'Financial Committee'},
  {id:3,title:'SEC committee',d:'2026-10-18',tm:'11:30',who:'SEC Committee'}],
 comm:[
  {n:'Executive Committee',h:'Chairman',c:8,s:'Active'},{n:'Financial Committee',h:'Finance Head',c:6,s:'Active'},
  {n:'SEC Committee',h:'SEC Head',c:10,s:'Active'},{n:'Disciplinary Committee',h:'Disciplinary Manager',c:6,s:'Active'},
  {n:'Operations Committee',h:'Operations Manager',c:9,s:'Review'},{n:'Salary Committee',h:'Salary Team Lead',c:5,s:'Active'}],
 log:[{t:'02 Oct 2026, 18:10',a:'Portal set up'}]
});
const DEPTS=[['Executive','Chairman’s office and strategy'],['Operations','Daily execution and delivery'],['Finance','Budget, records and reporting'],['Disciplinary','Internal review and conduct'],['Parliament','Deliberation and coordination'],['SEC Committee','Security and oversight']];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.members)S=SEED();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const log=a=>{S.log.unshift({t:new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),a});S.log=S.log.slice(0,60);save()};
const nid=l=>Math.max(0,...l.map(x=>x.id))+1;
let view='dashboard';
try{if(sessionStorage.getItem('sona_in')==='1')setTimeout(enter,0)}catch(e){}

function login(){
 if($('#em').value.trim().toLowerCase()==='chairman@sonainfo.com'&&$('#pw').value==='admin'){try{sessionStorage.setItem('sona_in','1')}catch(e){}enter();log('Chairman signed in')}
 else $('#le').textContent='Email or password is incorrect. Check the demo login below.'}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#login').classList.contains('hide')&&!$('#app').offsetParent)login();if(e.key==='Escape')cm()});
function enter(){$('#login').classList.add('hide');$('#app').classList.remove('hide');go(view)}
function logout(){try{sessionStorage.removeItem('sona_in')}catch(e){}$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').value=''}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}

const NAV=[['dashboard','⌂','Dashboard'],['approvals','✔','Approvals'],['members','♙','Members'],['departments','▦','Departments'],['committees','♜','Committees'],['finance','₹','Finance'],['meetings','▣','Meetings'],['announcements','◉','Announcements'],['audit','☰','Audit log'],['settings','⚙','Settings']];
const pend=()=>S.appr.filter(a=>a.st==='Pending');
function go(v){view=v;sb.classList.remove('open');
 $('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===v?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}${n[0]==='approvals'&&pend().length?`<span class="cnt">${pend().length}</span>`:''}</button>`).join('');
 $('#c').innerHTML=V[v]();scrollTo(0,0)}
const ph=(t,p,b='')=>`<div class="ph"><div><h1>${t}</h1><p>${p}</p></div><div>${b}</div></div>`;
const tot=t=>S.tx.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const bal=()=>tot('Income')-tot('Expense');
const tag=s=>`<span class="tg ${{Active:'g',Approved:'g',Published:'g',Pending:'y',Review:'y',Rejected:'r',Income:'g',Expense:'y'}[s]||''}">${esc(s)}</span>`;
const dd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const today=()=>new Date().toISOString().slice(0,10);

function apprRow(a,full){return `<div class="row"><div><b>${esc(a.title)}</b><small>${esc(a.type)} · requested by ${esc(a.by)}${a.amt?' · '+fmt(a.amt):''}</small></div>
 ${a.st==='Pending'?`<div class="ac"><button class="btn ok" onclick="decide(${a.id},true)">Approve</button><button class="btn no" onclick="decide(${a.id},false)">Reject</button></div>`:tag(a.st)}</div>`}
function months(){const out=[],n=new Date();for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),k=d.toISOString().slice(0,7);
 out.push({l:d.toLocaleString('en',{month:'short'}),i:S.tx.filter(x=>x.t==='Income'&&x.d.startsWith(k)).reduce((s,x)=>s+x.a,0),e:S.tx.filter(x=>x.t==='Expense'&&x.d.startsWith(k)).reduce((s,x)=>s+x.a,0)})}return out}
function chart(){const m=months(),mx=Math.max(1,...m.map(x=>Math.max(x.i,x.e)));
 return `<div class="ch">${m.map(x=>`<div><div class="pair"><span class="in" style="height:${x.i/mx*100}%" title="Income ${fmt(x.i)}"></span><span class="ex" style="height:${x.e/mx*100}%" title="Expense ${fmt(x.e)}"></span></div><small>${x.l}</small></div>`).join('')}</div>
 <div class="lgd" style="margin-top:10px"><span><i class="in"></i>Income</span><span><i class="ex"></i>Expense</span></div>`}

const V={
dashboard(){const up=S.meet.filter(m=>m.d>=today()).sort((a,b)=>a.d.localeCompare(b.d));
 return ph('Good day, Chairman','Everything that needs your attention at Sonainfo.',`<button class="btn p" onclick="annForm()">+ Announcement</button>`)+
 `<div class="g4"><div class="cd kp hl"><small>Awaiting your decision</small><div>${pend().length}</div></div>
 <div class="cd kp"><small>Active members</small><div>${S.members.filter(m=>m.st==='Active').length}</div></div>
 <div class="cd kp"><small>Available balance</small><div>${fmt(bal())}</div></div>
 <div class="cd kp"><small>Upcoming meetings</small><div>${up.length}</div></div></div>
 <div class="g2"><div class="cd"><h3>Decisions awaiting you<button class="btn" onclick="go('approvals')">All approvals</button></h3><div class="cb">${pend().slice(0,4).map(a=>apprRow(a)).join('')||'<div class="empty">Nothing pending. You are all caught up.</div>'}</div></div>
 <div class="cd"><h3>Income vs expense</h3><div class="cb">${chart()}</div></div></div>
 <div class="g2"><div class="cd"><h3>Next meetings</h3><div class="cb">${up.slice(0,4).map(m=>`<div class="row"><div><b>${esc(m.title)}</b><small>${esc(m.who)}</small></div><span>${dd(m.d)}, ${esc(m.tm)}</span></div>`).join('')||'<div class="empty">No upcoming meetings.</div>'}</div></div>
 <div class="cd"><h3>Recent activity</h3><div class="cb">${S.log.slice(0,5).map(l=>`<div class="row"><div>${esc(l.a)}<small>${esc(l.t)}</small></div></div>`).join('')}</div></div></div>`},
approvals(){return ph('Approvals','Requests from departments that need the chairman’s sign-off.')+
 `<div class="cd"><h3>Pending (${pend().length})</h3><div class="cb">${pend().map(a=>apprRow(a)).join('')||'<div class="empty">No pending requests.</div>'}</div></div>
 <div class="cd" style="margin-top:16px"><h3>Decided</h3><div class="cb">${S.appr.filter(a=>a.st!=='Pending').map(a=>apprRow(a)).join('')||'<div class="empty">No decisions yet.</div>'}</div></div>`},
members(){return ph('Members','Add, edit and review everyone in the organisation.',`<button class="btn p" onclick="memForm()">+ Add member</button>`)+
 `<div class="cd"><h3>Directory <input class="srch" style="max-width:240px" placeholder="Filter members" oninput="$('#mt2').innerHTML=memRows(this.value)"></h3><div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody id="mt2">${memRows('')}</tbody></table></div></div>`},
departments(){return ph('Departments','Headcount by department.')+`<div class="g3">${DEPTS.map(d=>{const n=S.members.filter(m=>m.dept===d[0]).length;return `<div class="cd dc"><h3>${d[0]}</h3><p>${d[1]}</p><b>${n}</b> member${n===1?'':'s'}<div class="pb"><span style="width:${Math.min(100,n*20)}%"></span></div></div>`}).join('')}</div>`},
committees(){return ph('Committees','Heads and strength of each committee.')+`<div class="g3">${S.comm.map(c=>`<div class="cd dc"><div style="display:flex;justify-content:space-between"><h3>${esc(c.n)}</h3>${tag(c.s)}</div><p>Head: ${esc(c.h)}</p><b>${c.c}</b> members</div>`).join('')}</div>`},
finance(){const b=450000,ex=tot('Expense');return ph('Finance','Income, expenses and the available balance.',`<button class="btn p" onclick="txForm()">+ Add transaction</button>`)+
 `<div class="g4"><div class="cd kp"><small>Budget FY 2026–27</small><div>${fmt(b)}</div></div><div class="cd kp"><small>Total income</small><div>${fmt(tot('Income'))}</div></div><div class="cd kp"><small>Total expenses</small><div>${fmt(ex)}</div></div><div class="cd kp hl"><small>Available balance</small><div>${fmt(bal())}</div></div></div>
 <div class="g2"><div class="cd"><h3>Last six months</h3><div class="cb">${chart()}</div></div><div class="cd"><h3>Budget used</h3><div class="cb"><div style="font:600 32px Newsreader,serif">${Math.round(ex/b*100)}%</div><div class="pb"><span style="width:${Math.min(100,ex/b*100)}%"></span></div><p class="hint">${fmt(ex)} of ${fmt(b)} spent.</p></div></div></div>
 <div class="cd"><h3>Transactions</h3><div class="tw"><table><thead><tr><th>Description</th><th>Amount</th><th>Type</th><th>Date</th><th></th></tr></thead><tbody>${[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).map(t=>`<tr><td>${esc(t.n)}</td><td>${fmt(t.a)}</td><td>${tag(t.t)}</td><td>${dd(t.d)}</td><td><button class="btn no" style="padding:3px 9px" onclick="del('tx',${t.id},'transaction')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`},
meetings(){return ph('Meetings','Schedule and track meetings.',`<button class="btn p" onclick="meetForm()">+ Schedule meeting</button>`)+
 `<div class="cd"><div class="cb">${[...S.meet].sort((a,b)=>a.d.localeCompare(b.d)).map(m=>`<div class="row"><div><b>${esc(m.title)}</b><small>${esc(m.who)}</small></div><div class="ac"><span>${dd(m.d)}, ${esc(m.tm)}</span>${m.d<today()?tag('Done'):''}<button class="btn no" onclick="del('meet',${m.id},'meeting')">Delete</button></div></div>`).join('')||'<div class="empty">No meetings scheduled yet.</div>'}</div></div>`},
announcements(){return ph('Announcements','Publish notices to the whole organisation.',`<button class="btn p" onclick="annForm()">+ New announcement</button>`)+
 `<div class="cd"><div class="cb" id="al">${annRows(S.ann)}</div></div>`},
audit(){return ph('Audit log','Every decision and change made in this portal.')+`<div class="cd"><div class="cb">${S.log.map(l=>`<div class="row"><div>${esc(l.a)}</div><small>${esc(l.t)}</small></div>`).join('')}</div></div>`},
settings(){return ph('Settings','Portal preferences.')+`<div class="cd"><div class="cb"><div class="row"><div><b>Theme</b><small>Switch between light and dark.</small></div><button class="btn" onclick="theme()">Toggle</button></div>
 <div class="row"><div><b>Reset demo data</b><small>Restore the original sample members, finance and requests.</small></div><button class="btn no" onclick="ask('Reset all data to the original sample data?',()=>{S=SEED();save();go('dashboard');toast('Data reset')})">Reset</button></div></div></div>`}};

const memRows=q=>{q=q.toLowerCase();const l=S.members.filter(m=>Object.values(m).join(' ').toLowerCase().includes(q));
 return l.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.role)}</td><td>${esc(m.dept)}</td><td>${esc(m.email)}</td><td>${tag(m.st)}</td><td class="ac"><button class="btn" onclick="memForm(${m.id})">Edit</button><button class="btn no" onclick="del('members',${m.id},'member')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No members match. Try a different search.</td></tr>'};
const annRows=l=>l.map(a=>`<div class="row"><div><b>${esc(a.title)}</b><small>${esc(a.text)}</small><small>${esc(a.cat)} · ${dd(a.date)}</small></div><button class="btn no" onclick="del('ann',${a.id},'announcement')">Delete</button></div>`).join('')||'<div class="empty">No announcements yet.</div>';

function decide(id,ok){const a=S.appr.find(x=>x.id===id);a.st=ok?'Approved':'Rejected';
 if(ok&&a.type==='Expense'&&a.amt)S.tx.push({id:nid(S.tx),d:today(),n:a.title,t:'Expense',a:a.amt});
 log(`${ok?'Approved':'Rejected'}: ${a.title}`);save();go(view);toast(ok?'Approved':'Rejected')}
function del(k,id,w){ask(`Delete this ${w}?`,()=>{const o=S[k].find(x=>x.id===id);S[k]=S[k].filter(x=>x.id!==id);log(`Deleted ${w}: ${o.name||o.title||o.n}`);save();go(view);toast('Deleted')})}
function gs(v){v=v.toLowerCase().trim();if(!v)return;const m=S.members.find(m=>Object.values(m).join(' ').toLowerCase().includes(v));if(m){view='members';go('members');$('#mt2').innerHTML=memRows(v)}}

let F=[],OK=()=>{};
function cm(){$('#mo').classList.remove('on')}
function form(t,f,ok,v={},label='Save'){F=f;OK=ok;$('#mt').textContent=t;
 $('#mb').innerHTML=f.map(x=>`<div class="fg"><label for="f_${x.k}">${x.l}</label>${x.o?`<select id="f_${x.k}">${x.o.map(o=>`<option ${v[x.k]==o?'selected':''}>${o}</option>`).join('')}</select>`:x.t==='area'?`<textarea id="f_${x.k}">${esc(v[x.k]||'')}</textarea>`:`<input id="f_${x.k}" type="${x.t||'text'}" value="${esc(v[x.k]??'')}">`}</div>`).join('');
 $('#mf').innerHTML=`<button class="btn" onclick="cm()">Cancel</button><button class="btn p" onclick="sub()">${label}</button>`;$('#mo').classList.add('on')}
function sub(){const v={};F.forEach(f=>v[f.k]=$('#f_'+f.k).value.trim());OK(v)}
function ask(msg,fn){F=[];OK=()=>{cm();fn()};$('#mt').textContent='Please confirm';$('#mb').innerHTML=`<p>${esc(msg)}</p>`;$('#mf').innerHTML=`<button class="btn" onclick="cm()">Cancel</button><button class="btn no" onclick="sub()">Yes, continue</button>`;$('#mo').classList.add('on')}
function toast(m){const e=document.createElement('div');e.className='t';e.textContent=m;$('#ts').appendChild(e);setTimeout(()=>e.remove(),2800)}
function need(v,k){if(k.some(x=>!v[x])){toast('Fill in all required fields.');return false}return true}

function memForm(id){const m=S.members.find(x=>x.id===id)||{};
 form(id?'Edit member':'Add member',[{k:'name',l:'Full name'},{k:'role',l:'Role'},{k:'dept',l:'Department',o:DEPTS.map(d=>d[0])},{k:'email',l:'Email',t:'email'},{k:'st',l:'Status',o:['Active','Pending']}],v=>{
  if(!need(v,['name','email']))return;
  if(id){Object.assign(m,v);log('Updated member: '+v.name)}else{S.members.push({id:nid(S.members),...v});log('Added member: '+v.name)}
  save();cm();go('members');toast('Member saved')},m)}
function annForm(){form('New announcement',[{k:'title',l:'Title'},{k:'cat',l:'Category',o:['System','Meeting','Policy']},{k:'text',l:'Message',t:'area'}],v=>{
 if(!need(v,['title','text']))return;S.ann.unshift({id:nid(S.ann),...v,date:today()});log('Published announcement: '+v.title);save();cm();go('announcements');toast('Published')},{},'Publish')}
function txForm(){form('Add transaction',[{k:'n',l:'Description'},{k:'a',l:'Amount (₹)',t:'number'},{k:'t',l:'Type',o:['Income','Expense']},{k:'d',l:'Date',t:'date'}],v=>{
 if(!need(v,['n','a','d']))return;S.tx.push({id:nid(S.tx),n:v.n,t:v.t,d:v.d,a:Math.abs(+v.a)});log(`Added ${v.t.toLowerCase()}: ${v.n}`);save();cm();go('finance');toast('Transaction added')},{d:today()})}
function meetForm(){form('Schedule meeting',[{k:'title',l:'Title'},{k:'who',l:'Attendees'},{k:'d',l:'Date',t:'date'},{k:'tm',l:'Time',t:'time'}],v=>{
 if(!need(v,['title','d','tm']))return;S.meet.push({id:nid(S.meet),...v});log('Scheduled meeting: '+v.title);save();cm();go('meetings');toast('Meeting scheduled')},{tm:'10:00'},'Schedule')}
</script>
</body>
</html>
