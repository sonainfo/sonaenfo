<style>

/* =========================================================
   SONINFO — LIGHT PREMIUM EXECUTIVE LOGIN
   ========================================================= */

#login{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  min-height:100vh!important;
  overflow:auto!important;

  display:flex!important;
  align-items:center!important;
  justify-content:center!important;

  padding:32px;

  box-sizing:border-box;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif!important;

  color:#172033!important;

  background:
    radial-gradient(
      circle at 8% 10%,
      rgba(96,165,250,.20),
      transparent 28%
    ),
    radial-gradient(
      circle at 92% 15%,
      rgba(125,211,252,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(165,180,252,.16),
      transparent 28%
    ),
    #f5f9ff!important;

  z-index:9999;
}

#login.hide{
  display:none!important;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.sx-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.sx-grid{
  position:absolute;
  inset:0;

  opacity:.45;

  background-image:
    linear-gradient(
      rgba(59,130,246,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(59,130,246,.035) 1px,
      transparent 1px
    );

  background-size:48px 48px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 90%
    );
}

.sx-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(4px);
  pointer-events:none;

  animation:sxFloat 14s ease-in-out infinite;
}

.sx-orb.one{
  width:420px;
  height:420px;

  left:-190px;
  top:-180px;

  background:
    radial-gradient(
      circle,
      rgba(59,130,246,.18),
      transparent 68%
    );
}

.sx-orb.two{
  width:450px;
  height:450px;

  right:-200px;
  bottom:-220px;

  background:
    radial-gradient(
      circle,
      rgba(14,165,233,.14),
      transparent 68%
    );

  animation-delay:-5s;
}

.sx-orb.three{
  width:260px;
  height:260px;

  right:28%;
  top:3%;

  background:
    radial-gradient(
      circle,
      rgba(129,140,248,.10),
      transparent 70%
    );

  animation-delay:-9s;
}

@keyframes sxFloat{
  0%,100%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(0,-18px) scale(1.04);
  }
}


/* =========================================================
   MAIN CARD
   ========================================================= */

.sx-shell{
  position:relative;
  z-index:5;

  width:min(1160px,100%);

  min-height:650px;

  display:grid;

  grid-template-columns:
    1.08fr .92fr;

  overflow:hidden;

  border:
    1px solid rgba(148,163,184,.20);

  border-radius:30px;

  background:
    rgba(255,255,255,.82);

  box-shadow:
    0 35px 90px rgba(30,64,175,.13),
    0 8px 30px rgba(15,23,42,.06);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}


/* =========================================================
   LEFT BRAND SECTION
   ========================================================= */

.sx-brand{
  position:relative;

  padding:55px 58px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(239,246,255,.96),
      rgba(248,251,255,.78)
    );

  border-right:
    1px solid rgba(148,163,184,.14);
}

.sx-brand::before{
  content:"";

  position:absolute;

  width:380px;
  height:380px;

  right:-180px;
  top:-170px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(59,130,246,.13),
      transparent 68%
    );
}

.sx-brand::after{
  content:"";

  position:absolute;

  width:330px;
  height:330px;

  left:-180px;
  bottom:-180px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(14,165,233,.09),
      transparent 70%
    );
}


/* =========================================================
   LOGO
   ========================================================= */

.sx-logo-row{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;

  gap:14px;
}

.sx-logo{
  width:54px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:16px;

  color:white;

  font-size:20px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #06b6d4
    );

  box-shadow:
    0 12px 25px rgba(37,99,235,.20);
}

.sx-brand-name{
  color:#172033;

  font-size:25px;

  font-weight:850;

  letter-spacing:-.8px;
}

.sx-brand-name span{
  color:#1687d9;
}

.sx-brand-sub{
  margin-top:3px;

  color:#7b8ba3;

  font-size:10px;

  font-weight:800;

  letter-spacing:1.7px;

  text-transform:uppercase;
}


/* =========================================================
   WELCOME
   ========================================================= */

.sx-welcome{
  position:relative;
  z-index:2;

  max-width:560px;

  margin-top:58px;
}

.sx-mini-badge{
  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:8px 13px;

  border:
    1px solid #dbeafe;

  border-radius:999px;

  background:#eff6ff;

  color:#2563eb;

  font-size:10px;

  font-weight:850;

  letter-spacing:1px;

  text-transform:uppercase;
}

.sx-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 9px rgba(34,197,94,.45);
}

.sx-welcome h1{
  margin:20px 0 17px;

  color:#172033;

  font-size:
    clamp(42px,4vw,62px);

  line-height:1.02;

  letter-spacing:-3px;

  font-weight:900;
}

.sx-welcome h1::first-line{
  color:#172033;
}

.sx-welcome p{
  max-width:530px;

  margin:0;

  color:#64748b;

  font-size:14px;

  line-height:1.8;
}


/* =========================================================
   WELCOME HIGHLIGHT
   ========================================================= */

.sx-marquee{
  width:100%;

  margin-top:32px;

  padding:11px 0;

  overflow:hidden;

  border-top:
    1px solid #e8eef7;

  border-bottom:
    1px solid #e8eef7;

  background:
    rgba(239,246,255,.55);
}

.sx-marquee-track{
  width:max-content;

  display:flex;

  animation:
    sxMarquee 28s linear infinite;
}

.sx-marquee-track span{
  padding-right:50px;

  color:#8090a8;

  font-size:10px;

  font-weight:800;

  letter-spacing:1.4px;

  white-space:nowrap;
}

.sx-marquee-track b{
  color:#38bdf8;

  margin:0 8px;
}

@keyframes sxMarquee{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }

}


/* =========================================================
   STATS
   ========================================================= */

.sx-stats{
  display:flex;

  gap:10px;

  margin-top:27px;
}

.sx-stat{
  min-width:112px;

  padding:13px 15px;

  border:
    1px solid #e6edf7;

  border-radius:14px;

  background:
    rgba(255,255,255,.78);

  box-shadow:
    0 5px 15px rgba(30,64,175,.04);
}

.sx-stat strong{
  display:block;

  color:#1e3a8a;

  font-size:16px;

  font-weight:850;
}

.sx-stat span{
  display:block;

  margin-top:3px;

  color:#8a99ae;

  font-size:9px;

  font-weight:750;

  letter-spacing:.7px;

  text-transform:uppercase;
}


/* =========================================================
   RIGHT LOGIN PANEL
   ========================================================= */

.sx-form-panel{
  position:relative;

  padding:52px 54px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  background:
    rgba(255,255,255,.92);
}

.sx-form-panel::before{
  content:"";

  position:absolute;

  width:260px;
  height:260px;

  right:-130px;
  top:-130px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(56,189,248,.09),
      transparent 70%
    );

  pointer-events:none;
}


/* =========================================================
   LOGIN HEADER
   ========================================================= */

.sx-form-top{
  position:relative;
  z-index:2;

  margin-bottom:27px;
}

.sx-form-top h2{
  margin:0 0 7px;

  color:#172033;

  font-size:30px;

  font-weight:850;

  letter-spacing:-1.2px;
}

.sx-form-top p{
  margin:0;

  color:#7b8ba3;

  font-size:13px;

  line-height:1.6;
}


/* =========================================================
   ACCOUNT CHIPS
   ========================================================= */

#chips{
  position:relative;
  z-index:3;

  display:grid!important;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;

  margin-bottom:20px;
}

#chips button{
  min-height:40px;

  border:
    1px solid #e2e8f0!important;

  border-radius:11px!important;

  background:
    #f8fafc!important;

  color:#526176!important;

  font-size:10px!important;

  font-weight:800!important;

  cursor:pointer;

  transition:
    .2s ease;

  box-shadow:none!important;
}

#chips button:hover{
  transform:translateY(-1px);

  border-color:
    #93c5fd!important;

  background:
    #eff6ff!important;

  color:#2563eb!important;
}


/* =========================================================
   INPUT
   ========================================================= */

.sx-field{
  margin-bottom:16px;
}

.sx-field label{
  display:block;

  margin-bottom:7px;

  color:#66758b;

  font-size:10px;

  font-weight:850;

  letter-spacing:1px;

  text-transform:uppercase;
}

.sx-input-wrap{
  position:relative;
}

.sx-input{
  width:100%;

  height:51px;

  box-sizing:border-box;

  padding:0 15px;

  outline:none;

  border:
    1px solid #dfe7f1;

  border-radius:12px;

  background:#f9fbfe;

  color:#172033;

  font-size:13px;

  transition:
    .2s ease;

  box-shadow:
    inset 0 1px 2px rgba(15,23,42,.025);
}

.sx-input::placeholder{
  color:#a6b2c2;
}

.sx-input:hover{
  border-color:#cbd8e8;
}

.sx-input:focus{
  background:#fff;

  border-color:#60a5fa;

  box-shadow:
    0 0 0 4px rgba(59,130,246,.08);
}

#pw{
  padding-right:80px;
}


/* =========================================================
   PASSWORD SHOW
   ========================================================= */

.sx-password-toggle{
  position:absolute;

  right:7px;
  top:7px;

  height:37px;

  padding:0 11px;

  border:0;

  border-radius:8px;

  background:#eef3f9;

  color:#64748b;

  font-size:10px;

  font-weight:800;

  cursor:pointer;
}

.sx-password-toggle:hover{
  background:#e0edff;

  color:#2563eb;
}


/* =========================================================
   ERROR
   ========================================================= */

#le{
  min-height:17px;

  margin:
    2px 0 2px;

  color:#e11d48;

  font-size:11px;

  font-weight:650;
}

#sy{
  color:#94a3b8!important;

  font-size:10px!important;
}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

.sx-login-btn{
  position:relative;
  z-index:3;

  width:100%;

  height:51px;

  margin-top:14px;

  border:0;

  border-radius:12px;

  cursor:pointer;

  color:#fff;

  font-size:13px;

  font-weight:850;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #0891b2
    );

  box-shadow:
    0 12px 25px rgba(37,99,235,.18);

  transition:
    .2s ease;
}

.sx-login-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 17px 30px rgba(37,99,235,.23);

  filter:brightness(1.04);
}

.sx-login-btn:active{
  transform:translateY(0);
}

.sx-login-btn:disabled{
  opacity:.65;

  cursor:wait;
}


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

.sx-forgot{
  display:flex;

  justify-content:center;

  margin-top:15px;
}

.sx-forgot button{
  border:0;

  background:none;

  color:#3182ce;

  font-size:11px;

  font-weight:750;

  cursor:pointer;
}

.sx-forgot button:hover{
  color:#1d4ed8;

  text-decoration:underline;
}


/* =========================================================
   SECURITY
   ========================================================= */

.sx-security{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  margin-top:24px;

  color:#a0aec0;

  font-size:9px;

  font-weight:700;
}

.sx-lock{
  width:7px;
  height:9px;

  position:relative;

  border:
    1px solid #94a3b8;

  border-radius:2px;
}

.sx-lock::before{
  content:"";

  position:absolute;

  width:5px;
  height:5px;

  left:0;
  top:-6px;

  border:
    1px solid #94a3b8;

  border-bottom:0;

  border-radius:
    5px 5px 0 0;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

  #login{
    padding:15px;
  }

  .sx-shell{
    width:min(570px,100%);

    min-height:auto;

    grid-template-columns:1fr;

    max-height:
      calc(100vh - 30px);

    overflow:auto;

    border-radius:24px;
  }

  .sx-brand{
    padding:34px;

    min-height:360px;

    border-right:0;

    border-bottom:
      1px solid #e5edf6;
  }

  .sx-form-panel{
    padding:34px;
  }

  .sx-welcome{
    margin-top:35px;
  }

}


@media(max-width:520px){

  #login{
    padding:9px;
  }

  .sx-shell{
    width:100%;

    max-height:
      calc(100vh - 18px);

    border-radius:20px;
  }

  .sx-brand{
    padding:25px;

    min-height:330px;
  }

  .sx-form-panel{
    padding:25px;
  }

  .sx-logo{
    width:47px;
    height:47px;

    border-radius:13px;

    font-size:17px;
  }

  .sx-brand-name{
    font-size:21px;
  }

  .sx-welcome h1{
    font-size:38px;

    letter-spacing:-2px;
  }

  .sx-welcome p{
    font-size:12px;
  }

  .sx-stats{
    gap:6px;
  }

  .sx-stat{
    min-width:0;

    flex:1;

    padding:10px;
  }

  .sx-stat strong{
    font-size:14px;
  }

  .sx-stat span{
    font-size:8px;
  }

  .sx-form-top h2{
    font-size:25px;
  }

}


/* =========================================================
   REMOVE OLD DARK LOGIN OVERRIDES
   ========================================================= */

#login input{
  font-family:inherit;
}

#login button{
  font-family:inherit;
}


/* =========================================================
   SMOOTH APPEARANCE
   ========================================================= */

.sx-shell{
  animation:
    sxAppear .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes sxAppear{

  from{
    opacity:0;
    transform:
      translateY(15px)
      scale(.985);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

</style>
