<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonainfo Portal</title><meta name="theme-color" content="#0b1d2e"><meta name="description" content="Sonainfo Portal. Only authorised persons."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600&display=swap">
<style>
:root{--bg:#eff2f6;--sf:#fff;--tx:#131f2e;--mu:#637085;--bd:#dfe4ec;--pr:#0f766e;--gd:#b8862b;--ok:#12803f;--wa:#b45309;--er:#c42b2b;--sb:#0b1624;--hv:#f3f5f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08101b;--sf:#101b2a;--tx:#e6ebf2;--mu:#93a1b5;--bd:#21304a;--hv:#16243a;--sb:#050a12}}
:root[data-theme=dark]{--bg:#08101b;--sf:#101b2a;--tx:#e6ebf2;--mu:#93a1b5;--bd:#21304a;--hv:#16243a;--sb:#050a12}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 12% 10%,#12413f,transparent),radial-gradient(800px 500px at 92% 92%,#3a2c0e,transparent),var(--sb)}
.lg{width:100%;max-width:960px;display:grid;grid-template-columns:1.05fr 1fr;background:var(--sf);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lg-a{background:linear-gradient(160deg,#0f3a38,#0b1f2e);color:#e9f3f1;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.lg-a h1{font-size:36px;line-height:1.12}.lg-a p{color:#a9c7c2}
.st{display:flex;gap:24px}.st div{font:600 28px Newsreader,serif;color:#e6c26e}.st small{display:block;font:12px "IBM Plex Sans";color:#a9c7c2}
.lg-b{padding:36px}.lg-b h2{font-size:26px}.lg-b>p{color:var(--mu);margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--hv);border-radius:99px;padding:3px 11px;font-size:12px}.chip:hover{border-color:var(--gd)}
.fg{margin-bottom:13px}.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
.fg textarea{min-height:80px;resize:vertical}
.err{color:var(--er);font-size:12px;min-height:18px;margin-bottom:6px}
.btn{border:1px solid var(--bd);background:var(--sf);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--hv)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.g{background:var(--gd);border-color:var(--gd);color:#fff}
.btn.no{color:var(--er);border-color:var(--er)}.btn.w{width:100%;padding:11px}
.hint{margin-top:12px;font-size:12px;color:var(--mu)}
#app{display:flex;min-height:100%}
aside{width:244px;background:var(--sb);color:#b9c4d4;position:fixed;top:0;bottom:0;left:0;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 12px;display:flex;flex-direction:column;z-index:50;transition:transform .2s}
.logo{font:600 22px Newsreader,serif;color:#fff;padding:0 10px 16px}.logo b{color:var(--gd)}
nav{flex:1;overflow:auto}

.cnt{margin-left:auto;background:var(--gd);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.me{border-top:1px solid rgba(255,255,255,.1);padding:12px 8px 0;font-size:12px}.me b{color:#fff;display:block}
main{margin-left:244px;flex:1;min-width:0}

.srch{max-width:300px;width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
#c{padding:26px 24px;max-width:1320px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}

.cb{padding:14px 18px}
.kp{padding:16px 18px}.kp small{color:var(--mu)}.kp div{font:600 28px Newsreader,serif;margin-top:2px}.kp.hl{border-color:var(--gd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mu);display:block}
.tg{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--hv);color:var(--mu);white-space:nowrap}
.tg.g{background:rgba(18,128,63,.14);color:var(--ok)}.tg.y{background:rgba(180,83,9,.14);color:var(--wa)}.tg.r{background:rgba(196,43,43,.14);color:var(--er)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:10px 14px;background:var(--hv);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--bd)}td small{display:block;color:var(--mu)}
td.c{text-align:center}
.ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ac .btn{padding:4px 10px;font-size:12px}
.hb{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}.hb b{text-align:right}
.pb{height:7px;background:var(--hv);border-radius:9px;overflow:hidden}.pb span{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--gd))}
.dc{padding:18px}.dc h3{font-size:18px}.dc>small{color:var(--mu)}.dc .row{padding:6px 0}
.ch{display:flex;gap:14px;align-items:flex-end;height:170px}
.ch>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.pair{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1}
.pair span{width:40%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px;background:var(--pr)}.pair span+span{background:var(--gd)}
.tl{border-left:2px solid var(--bd);margin:8px 0 0 6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}
.tl div:before{content:"";position:absolute;left:-20px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--gd)}
.tl small{color:var(--mu);display:block}
#mo{position:fixed;inset:0;background:rgba(5,10,20,.6);display:none;place-items:center;padding:16px;z-index:100}#mo.on{display:grid}
.md{background:var(--sf);border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.md header{position:static;padding:14px 20px;border-radius:12px 12px 0 0}.md header h3{flex:1}
#mb{padding:18px 20px}#mf{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#ts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:200}
.t{background:var(--sb);color:#fff;padding:11px 16px;border-radius:8px;border-left:4px solid var(--gd)}
.empty{color:var(--mu);padding:24px;text-align:center}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0}#menu{display:block}.lg{grid-template-columns:1fr}.lg-a{display:none}.lg-b{padding:26px 20px}.g3{grid-template-columns:1fr}#c{padding:18px 14px}header{padding-left:14px;padding-right:14px}.srch{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:radial-gradient(1100px 380px at 85% -8%,rgba(15,118,110,.12),transparent),var(--bg)}
aside{background:linear-gradient(180deg,#0c2033,#06101a)}nav button{transition:.15s}nav button.on{background:linear-gradient(90deg,rgba(184,134,43,.28),rgba(184,134,43,.06))}
header{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--sf) 88%,transparent)}
.cd{box-shadow:0 1px 3px rgba(15,30,50,.06);transition:.2s}.kp:hover,.dc:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,30,50,.13)}
.kp.hl{background:linear-gradient(135deg,rgba(15,118,110,.12),rgba(184,134,43,.12))}
.btn{transition:.15s}.btn.p{box-shadow:0 3px 10px rgba(15,118,110,.28)}.btn:active{transform:scale(.97)}
#c>*{animation:fi .3s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}.tabs button{border:0;background:none;padding:10px 16px;color:var(--mu);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--pr);border-color:var(--gd)}
.an{display:flex;gap:14px;padding:16px 18px;border-left:4px solid var(--pr);margin-bottom:12px;background:var(--sf);border-radius:10px;border:1px solid var(--bd);border-left-width:4px}.an.Urgent{border-left-color:var(--er)}.an.Exam{border-left-color:var(--gd)}.an.Policy{border-left-color:#4f46e5}.an.Event{border-left-color:var(--ok)}.an p{margin:4px 0;color:var(--mu)}.an>div{flex:1}
.rl{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.rl div{padding:14px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}.rl b{display:block;margin-bottom:2px}
.chat{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 190px);min-height:420px;overflow:hidden}
.cl{border-right:1px solid var(--bd);overflow:auto;padding:10px}.cl small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:10px 8px 4px}
.cl button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left}.cl button:hover{background:var(--hv)}.cl button.on{background:rgba(15,118,110,.14);color:var(--pr);font-weight:600}
.cw{display:flex;flex-direction:column;min-width:0}.cw>h3{padding:14px 18px;border-bottom:1px solid var(--bd);font-size:17px}
#cm{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;max-width:78%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.bb{background:var(--hv);padding:8px 12px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere}.m.me .bb{background:var(--pr);color:#fff;border-radius:14px 14px 4px 14px}
.bb small{display:block;opacity:.65;font-size:11px;margin-top:2px}
.cs{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)}.cs input{flex:1;padding:10px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--bg)}
@media(max-width:760px){.chat{grid-template-columns:1fr;grid-template-rows:auto 1fr}.cl{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:6px}.cl small{display:none}.cl button{width:auto;white-space:nowrap}.rl{grid-template-columns:1fr}.m{max-width:92%}}

#login{background:radial-gradient(700px 500px at 15% 15%,rgba(15,118,110,.55),transparent),radial-gradient(700px 500px at 90% 90%,rgba(184,134,43,.45),transparent),linear-gradient(135deg,#050b14,#0b1d2e);background-size:140% 140%;animation:bg 14s ease infinite alternate}@keyframes bg{to{background-position:100% 100%}}
.lw{width:100%;display:grid;place-items:center}.lc{width:100%;max-width:420px;background:rgba(255,255,255,.96);color:#131f2e;border-radius:20px;padding:38px 34px;box-shadow:0 40px 90px rgba(0,0,0,.5);text-align:center;border-top:4px solid var(--gd)}
.lc .fg{text-align:left}.lc input{background:#fff;color:#131f2e}.shield{width:62px;height:62px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(135deg,var(--pr),#0b3a38);display:grid;place-items:center;font-size:30px;box-shadow:0 10px 24px rgba(15,118,110,.4)}
.lb{font:600 15px Newsreader,serif;letter-spacing:.35em;color:#637085}.lb b{color:var(--gd)}.lc h1{font-size:32px;margin:4px 0}.ls{color:#637085;margin-bottom:20px;font-size:13px;padding:6px 12px;background:#f3f5f9;border-radius:99px;display:inline-block}
.lc .btn.p{padding:13px;font-size:15px}.dm{margin-top:14px;text-align:left;font-size:12px;color:#637085}.dm summary{cursor:pointer}.dm .chips{margin-top:8px}.lc .chip{color:#131f2e}.lf{margin-top:16px;font-size:11px;color:#8a95a7}
.vr{display:grid;grid-template-columns:34px 44px 1fr 150px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}.vr:last-child{border:0}.vr .no{font:600 20px Newsreader,serif;color:var(--mu);text-align:center}
.vb{border:2px solid var(--pr);border-radius:12px;padding:6px 10px;text-align:center;background:var(--sf)}.vb small{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.vb b{font:600 24px Newsreader,serif}.vb input{width:100%;border:0;background:none;font:600 22px Newsreader,serif;text-align:center}
.vr.top .av{background:var(--gd)}@media(max-width:760px){.vr{grid-template-columns:28px 38px 1fr}.vr .vb{grid-column:1/-1}}

.lw{max-width:940px;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55)}.lw .lc{border-radius:0;box-shadow:none;max-width:none;height:100%;display:flex;flex-direction:column;justify-content:center}
.lw{place-items:stretch}.lp{position:relative;width:100%;height:100%;min-height:560px;background:#0b1d2e}.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.lp:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,11,20,.1) 40%,rgba(5,11,20,.88))}
.lq{position:absolute;left:26px;right:26px;bottom:26px;z-index:2;color:#fff;display:grid;gap:2px}.lq b{font:600 30px Newsreader,serif}.lq span{color:#e6c26e;letter-spacing:.2em;font-size:12px;text-transform:uppercase}.lq small{color:#c5d0de}
.cnt:empty{display:none}.qa{display:flex;flex-wrap:wrap;gap:8px}.qa .btn{background:var(--hv)}
@media(max-width:760px){.lw{grid-template-columns:1fr}.lp{min-height:210px;height:210px}.lq b{font-size:22px}}

.me .btn{color:#131f2e;font-weight:600}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:26px 30px;margin-bottom:18px;border-radius:16px;color:#fff;background:radial-gradient(500px 220px at 90% 0,rgba(230,194,110,.35),transparent),linear-gradient(135deg,#0f766e,#0b2b3a);box-shadow:0 14px 34px rgba(11,43,58,.3);overflow:hidden}
.hero h1{font-size:30px}.hero small{opacity:.8}.hero p{opacity:.85;margin:2px 0 12px}.hero .qa .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}.hero .mk{font:600 96px Newsreader,serif;opacity:.16;line-height:1}
tbody tr:hover{background:var(--hv)}th{position:sticky;top:0;z-index:1}.kp{border-top:3px solid transparent}.kp.hl{border-top-color:var(--gd)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px}.t{box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lt{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.75;white-space:pre-wrap}.lt hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
.lbal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}@media(max-width:760px){.lbal{grid-template-columns:1fr 1fr}.hero .mk{display:none}.hero h1{font-size:23px}}
@media print{#app,#login,#ts{display:none!important}#mo{position:static;display:block!important;background:none;padding:0}.md{box-shadow:none;max-width:none;max-height:none}.md header button,#mf{display:none}}
</style>
